name: Cohort creation tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mimicwizard_cohort_test
          POSTGRES_USER: cohort_test
          POSTGRES_PASSWORD: cohort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cohort_test -d mimicwizard_cohort_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      COHORT_TEST_DB: mimicwizard_cohort_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cohort_test
      PGPASSWORD: cohort_test
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libuv1-dev
      - name: Install test dependencies
        shell: Rscript --vanilla {0}
        run: |
          packages <- c("DBI", "RPostgres", "dplyr", "dbplyr", "shiny", "shinyjs", "shinycssloaders", "tidyr")
          install.packages(packages, repos = "https://cloud.r-project.org")
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) {
            stop("Test dependencies failed to install or load: ", paste(missing, collapse = ", "))
          }
      - name: Run cohort creation matrix
        run: Rscript --vanilla tests/cohort-creation.R
