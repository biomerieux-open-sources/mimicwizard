name: Cohort creation tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mimicwizard_cohort_test
          POSTGRES_USER: cohort_test
          POSTGRES_PASSWORD: cohort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cohort_test -d mimicwizard_cohort_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      COHORT_TEST_DB: mimicwizard_cohort_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cohort_test
      PGPASSWORD: cohort_test
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install PostgreSQL headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install test dependencies
        run: Rscript --vanilla -e 'install.packages(c("DBI", "RPostgres", "dplyr"), repos = "https://cloud.r-project.org")'
      - name: Run cohort creation matrix
        run: Rscript --vanilla tests/cohort-creation.R
